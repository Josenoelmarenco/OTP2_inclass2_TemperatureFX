# SonarQube analysis settings - in-class assignment 7.
#
# This file is only used by the SonarScanner CLI (Option A in the assignment):
#
#     sonar-scanner
#
# When the analysis is started through Maven (Option B, the recommended one for
# this project) the scanner reads the <sonar.*> properties from pom.xml instead
# and ignores this file. Both paths are kept so either option works.
#
# The authentication token is NEVER stored here. It is passed through the
# SONAR_TOKEN environment variable, so that this file is safe to commit.

sonar.projectKey=otp2-temperature-fx
sonar.projectName=Temperature FX
sonar.projectVersion=1.0.0

sonar.host.url=http://localhost:9000

# Where the code is. Compiled classes are required: the Java analyser works on
# bytecode as well as on sources, so "mvn clean verify" has to run first.
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.java.source=21
sonar.sourceEncoding=UTF-8

# Coverage comes from the JaCoCo XML report produced during "mvn verify".
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# The JavaFX view classes cannot be unit tested without a graphical toolkit, so
# they are excluded from the COVERAGE metric only. They are still analysed for
# bugs, code smells and vulnerabilities. Remove this line to see the raw figure.
sonar.coverage.exclusions=src/main/java/fi/metropolia/tempfx/MainApp.java,src/main/java/fi/metropolia/tempfx/Main.java,src/main/java/fi/metropolia/tempfx/ui/**
